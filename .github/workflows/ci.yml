name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: node --check apps/web/app.js
      - run: node apps/web/verify-ui.mjs
      - run: node -e "JSON.parse(require('node:fs').readFileSync('apps/web/manifest.webmanifest', 'utf8'))"
