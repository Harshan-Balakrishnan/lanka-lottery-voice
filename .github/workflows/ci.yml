name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test domain safety gates
        run: npm test
      - name: Type-check domain
        run: npm run typecheck
      - name: Check web JavaScript syntax
        run: node --check apps/web/app.js
      - name: Verify web localization and safety disclosures
        run: node apps/web/verify-ui.mjs
      - name: Validate web manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('apps/web/manifest.webmanifest', 'utf8'))"
